# Project identity lives in app/__init__.py (VoxDock). The values below are
# NOT duplicated by hand - they are the inline defaults Compose falls back to,
# and scripts/check_identity.py asserts they match app/__init__.py.
name: ${VOXDOCK_COMPOSE_PROJECT:-voxdock}

# ============================================================================
#  VoxDock — GPU-accelerated dots.tts service.
#     docker compose up -d --build          # start (first build downloads ~8 GB)
#     docker compose exec tts python scripts/benchmark_test.py
#
#  Compose automatically reads the adjacent `.env` file for every ${VAR}
#  interpolation below, so `.env.example` -> `.env` is all the configuration
#  you normally need. The persistent `hf_cache` volume stops the ~4.4 GB of
#  checkpoint weights from being re-downloaded on every rebuild.
#
#  Identity (image / container / project name) is declared in app/__init__.py.
#  The defaults below mirror it; `python scripts/check_identity.py` fails if
#  the two ever drift apart.
# ============================================================================
services:
  tts:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Must match the `user:` below, so /etc/passwd has a matching entry.
        VOXDOCK_UID: "${VOXDOCK_UID:-1000}"
        VOXDOCK_GID: "${VOXDOCK_GID:-1000}"
    image: ${VOXDOCK_IMAGE:-voxdock-tts}:latest
    container_name: ${VOXDOCK_CONTAINER:-voxdock-tts}
    restart: unless-stopped

    # Run as the host user rather than root, so every file the service writes
    # into the bind-mounted ./data is owned by you. Without this the container
    # leaves root-owned reports and WAVs behind, which you cannot chown without
    # sudo. Override with VOXDOCK_UID/VOXDOCK_GID if your host uid differs
    # (`id -u` / `id -g`).
    user: "${VOXDOCK_UID:-1000}:${VOXDOCK_GID:-1000}"
    # The uid above cannot write to /root, so the two caches that used to live
    # there are re-homed under /cache (a world-writable tmpfs) and /app
    # respectively. HF_HOME is set for the same reason in the environment block.
    tmpfs:
      - /cache:mode=0777

    ports:
      - "${TTS_BIND_HOST:-127.0.0.1}:${TTS_PORT:-8000}:8000"

    environment:
      # ---- model + runtime ----
      TTS_MODEL_NAME: ${TTS_MODEL_NAME:-dots-studio/dots.tts-mf}
      TTS_PRECISION: ${TTS_PRECISION:-bfloat16}
      TTS_OPTIMIZE: ${TTS_OPTIMIZE:-true}
      TTS_WARMUP_ON_OPTIMIZE: ${TTS_WARMUP_ON_OPTIMIZE:-true}
      # Maximum TOTAL audio patches (reference prompt + generated audio).
      # 128 * 160 ms ~= 20.5 s of audio per request <=> the <128-patch memory
      # bucket that keeps peak VRAM at ~5.47 GB on a 6 GB RTX 4050.
      TTS_MAX_GENERATE_LENGTH: ${TTS_MAX_GENERATE_LENGTH:-128}
      # KV-cache size. Model default is 2048; halving it to 1024 saves ~170 MB
      # of VRAM, which is part of what makes the 128-patch budget reachable on
      # a 6 GB card. Keep this default in step with app/config.py.
      TTS_MAX_SEQUENCE_LENGTH: ${TTS_MAX_SEQUENCE_LENGTH:-1024}
      TTS_VOCODER_MERGE_STEPS: ${TTS_VOCODER_MERGE_STEPS:-4}
      # Low-VRAM patches (app/patches.py). NOT optional on a 6 GB card; see
      # .env.example. These must be forwarded here or setting them in `.env`
      # is silently ignored by the container.
      TTS_LOW_VRAM_PATCHES: ${TTS_LOW_VRAM_PATCHES:-true}
      TTS_VOCODER_CHUNK_PATCHES: ${TTS_VOCODER_CHUNK_PATCHES:-12}

      # ---- sampling defaults ----
      # 2 is the MeanFlow default AND sizes the DiT KV cache: at 4 steps the
      # cache doubles and the 128-patch budget above OOMs. Keep in step with
      # app/config.py.
      TTS_NUM_STEPS: ${TTS_NUM_STEPS:-2}
      TTS_GUIDANCE_SCALE: ${TTS_GUIDANCE_SCALE:-1.2}
      TTS_SPEAKER_SCALE: ${TTS_SPEAKER_SCALE:-1.5}
      TTS_SEED: ${TTS_SEED:-42}
      TTS_LANGUAGE: ${TTS_LANGUAGE:-none}
      TTS_NORMALIZE_TEXT: ${TTS_NORMALIZE_TEXT:-false}

      # ---- acceptance thresholds ----
      TTS_VRAM_LIMIT_GB: ${TTS_VRAM_LIMIT_GB:-5.5}
      TTS_RTF_TARGET: ${TTS_RTF_TARGET:-0.5}

      # ---- reference-audio cleaning / chunking ----
      TTS_NOISE_PROP_DECREASE: ${TTS_NOISE_PROP_DECREASE:-0.85}
      TTS_STATIONARY_NOISE: ${TTS_STATIONARY_NOISE:-true}
      TTS_SAMPLE_RATE: ${TTS_SAMPLE_RATE:-48000}
      TTS_REF_MIN_SECONDS: ${TTS_REF_MIN_SECONDS:-5}
      TTS_REF_MAX_SECONDS: ${TTS_REF_MAX_SECONDS:-15}
      TTS_CHUNK_MAX_WORDS: ${TTS_CHUNK_MAX_WORDS:-35}
      TTS_WORDS_PER_SECOND: ${TTS_WORDS_PER_SECOND:-2.5}
      TTS_MAX_RETRIES: ${TTS_MAX_RETRIES:-3}

      # ---- service plumbing ----
      TTS_LOG_LEVEL: ${TTS_LOG_LEVEL:-info}
      # Host thread count. Measured A/B on this host (5 timed requests, 2 warmups
      # each): OMP=8 -> engine RTF 0.4361, OMP=16 -> 0.4322. A real but ~0.9%
      # gain, so 8 stays the default - it is within run-to-run noise and is
      # safer on a laptop that is also doing other work. Raise it to your
      # physical core count (`nproc`) if you want the last percent.
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-8}
      TTS_API_URL: ${TTS_API_URL:-http://localhost:8000}
      HF_HOME: /cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      # `/root` is not writable by the non-root uid above, so HF_HOME is
      # re-homed to the tmpfs at /cache. The checkpoint volume is mounted
      # there instead (see volumes:), which keeps the ~4.4 GB of weights
      # persistent across rebuilds.
      # NOTE: expandable_segments lets the caching allocator return the ~200 MB
      # of "reserved but unallocated" gaps that appear between the LLM step, the
      # DiT KV cache and the BigVGAN vocoder. This used to be left OFF because
      # cudagraph trees cannot checkpoint an expandable-segment allocator; the
      # dots_tts compile options are rewritten to mode="default" in
      # app/patches.disable_cudagraphs(), so that conflict is gone and the
      # fragmentation can be reclaimed instead of OOM-ing.
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      # Persist torch.compile's generated kernels (~180 MB). Inductor writes these
      # under /tmp by default, which is NOT a volume, so every recreate re-pays
      # ~105 s of Inductor codegen. Pinning it to a mounted path makes restarts
      # reuse the compiled kernels; this is the single biggest startup cost.
      # Invalidate by bumping this value if kernels are ever suspected stale.
      TORCHINDUCTOR_CACHE_DIR: /app/.cache/torchinductor

    volumes:
      # Host project `data/` == container `/app/data` (references, chunks, output)
      - ./data:/app/data
      - hf_cache:/cache/huggingface
      # Compiled-kernel cache. A named volume, NOT a bind mount: the contents are
      # large, machine-specific and fully regenerable, so they should not land in
      # the working tree.
      - inductor_cache:/app/.cache/torchinductor

    # Large shared-memory segment for torch.compile / Triton workers.
    shm_size: "2gb"

    # NVIDIA GPU passthrough (spec Task 1.2): count 1, driver nvidia.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # Keep the checkpoint pinned in VRAM: never swap it back to system RAM.
    ulimits:
      memlock: -1
      stack: 67108864

volumes:
  hf_cache:
    # Kept as `local_tts_hf_cache` on purpose - Docker cannot rename a volume,
    # and this one holds ~4.4 GB of checkpoint weights. Renaming it would
    # orphan the cache and force a full re-download. See HF_CACHE_VOLUME in
    # app/__init__.py.
    name: ${VOXDOCK_HF_CACHE_VOLUME:-local_tts_hf_cache}
  inductor_cache:
    # torch.compile kernel cache (~180 MB). Created in the compose project
    # namespace, so `docker compose down` discards it but `--force-recreate`
    # (what autotune.py uses) keeps it - that is the whole point. Safe to
    # delete: the only cost is one slow, re-compiling startup.
    name: ${VOXDOCK_INDUCTOR_CACHE_VOLUME:-voxdock_inductor_cache}
