[pytest]
# The suite is host-side by design: no torch, no GPU, no running server. It runs
# in well under a second, which is the point - a safety net is only useful if it
# is cheap enough to actually run.
testpaths = tests
addopts = -q --strict-markers
# `-p no:cacheprovider` is deliberately NOT set: .pytest_cache/ is gitignored.
